[pytest]
markers =
    live: hits a real LLM API (non-deterministic, costs real requests). Excluded from default runs — see tests/test_adversarial_live.py. Run explicitly with `pytest -m live` before any deploy where the underlying model changes.

# Default `pytest` runs skip live tests (CI-safe, no API key required).
# Run them explicitly and deliberately with: pytest -m live
addopts = -m "not live"
